<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- PLP:HEADTHEME:START -->
<meta name="color-scheme" content="light dark">
<!-- цвет системных полей браузера = фон страницы. Без этого при прокрутке и
     оттягивании из-под страницы проглядывает чужой цвет — кажется, что фон мигает. -->
<meta name="theme-color" content="#f7f6f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0D09" media="(prefers-color-scheme: dark)">
<script>
(function(){
  function paintChrome(){
    try{
      var bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      if(!bg && document.body) bg=getComputedStyle(document.body).backgroundColor;
      if(!bg || bg==='rgba(0, 0, 0, 0)') return;
      var list=document.querySelectorAll('meta[name="theme-color"]');
      for(var i=0;i<list.length;i++) list[i].parentNode.removeChild(list[i]);
      var m=document.createElement('meta'); m.setAttribute('name','theme-color');
      m.setAttribute('content',bg); document.head.appendChild(m);
    }catch(e){}
  }
  /* Кнопка «поделиться»: на телефоне открывает системное меню, на компьютере
     кладёт ссылку в буфер и говорит об этом. Эльнур 07.09: «сайтом надо
     пользоваться, он не просто для красоты». */
  document.addEventListener('click', function(e){
    var b = e.target && e.target.closest && e.target.closest('[data-share]');
    if(!b) return;
    e.preventDefault();
    var path = b.getAttribute('data-share') || location.pathname;
    var url = location.origin + path;
    var title = b.getAttribute('data-share-title') || document.title;
    var done = function(){
      var was = b.innerHTML;   /* 15.09: в кнопке живёт svg-иконка, восстанавливаем разметку целиком */
      b.textContent = '✓ Ссылка скопирована';
      b.classList.add('ok');
      setTimeout(function(){ b.innerHTML = was; b.classList.remove('ok'); }, 2200);
    };
    if(navigator.share){ navigator.share({title:title, url:url}).catch(function(){}); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done).catch(function(){ prompt('Скопируйте ссылку:', url); });
    } else prompt('Скопируйте ссылку:', url);
  });
  window.paintChrome=paintChrome;
  /* Адрес без .html: страницы и так открываются коротким адресом, но если
     человек пришёл по старой ссылке, приводим строку браузера к чистому виду.
     Эльнур 07.09: «мне не нравится html в адресе, я ни у кого её не видел». */
  try{
    var pth=location.pathname;
    if(/\.html$/.test(pth)){
      var clean=pth.replace(/index\.html$/,'').replace(/\.html$/,'');
      if(clean==='') clean='/';
      history.replaceState(null,'',clean+location.search+location.hash);
    }
  }catch(e){}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',paintChrome);
  else paintChrome();
  try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintChrome); }catch(e){}
})();
</script>
<!-- PLP:HEADTHEME:END -->

<style>
/* PLP:ANTIFLICKER */
/* Мигание фона на телефоне — сводная защита. Эльнур 06.09: «фон в мобильной
   версии везде мигает, ищи по всем страницам». Три источника:
   1) размытие фона (backdrop-filter) под липкими элементами — браузер
      перерисовывает весь экран на каждом кадре прокрутки;
   2) долгое проявление блоков при прокрутке;
   3) отложенные картинки без фона — на их месте на миг светится подложка. */
@media(max-width:900px){
  .header,#toTop,.badge,.pm-tag,.car .tag,.btn-glass,.hero-float,.fbtn,.chipf,
  .modal-overlay,.mnav,.sheet,.pm-card,.toolbox{
    backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  .reveal{transition-duration:.35s!important}
}
.pic-photo,.thumb-photo,.prgs img,.simi-c i,.pm-img img{background-color:var(--warm,#EFEEE7)}
/* PLP:ANTIFLICKER */
html{background:var(--bg);overscroll-behavior-y:none}
:root{--bg:#f7f6f1;--card:#fff;--ink:#16170f;--mute:#6b6b60;--line:#e4e2d8;--acc:#1f4d3a;--accInk:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0C0D09;--card:#16170f;--ink:#efeee6;--mute:#a3a296;--line:#2a2b22;--acc:#8fc7a8;--accInk:#0C0D09}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:28px 16px 60px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
a.home{color:var(--mute);text-decoration:none;font-size:14px}
h1{font-size:28px;line-height:1.2;margin:18px 0 6px}
p.sub{color:var(--mute);margin:0 0 22px}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--ink);padding:7px 16px;font:inherit;font-size:14px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--acc);color:var(--accInk)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin:0 0 14px}
.card h2{font-size:21px;margin:0 0 6px}
.card p{margin:0 0 14px;color:var(--mute)}
.meta{font-size:13px;color:var(--mute);margin-bottom:14px}

.btn{display:inline-block;padding:10px 18px;border-radius:999px;text-decoration:none;font-size:15px;border:1px solid var(--acc);color:var(--acc)}
.btn.main{background:var(--acc);color:var(--accInk)}
.card img{width:100%;height:auto;border-radius:10px;margin:0 0 14px;display:block}
.card h2 a{color:inherit;text-decoration:none}
</style>

<body>
<div class="wrap">
  <header>
    <a class="home" href="/">← Property Library Phuket</a>
    <div class="lang" role="group" aria-label="Язык">
      <button type="button" data-l="ru">RU</button><button type="button" data-l="en">EN</button>
    </div>
  </header>
  <h1 id="h"></h1>
  <p class="sub" id="s"></p>
  <div id="list"></div>
</div>
<script>
(function(){
  var T={ru:{h:'Гиды',s:'Авторские маршруты Эльнура Ханкишиева. Скачайте PDF или откройте в браузере.',dl:'Скачать PDF',op:'Открыть',pg:'стр.'},
         en:{h:'Guides',s:'Curated routes by Elnur Khankishiev. Download the PDF or open it in your browser.',dl:'Download PDF',op:'Open',pg:'pages'}};
  var q=new URLSearchParams(location.search).get('lang');
  var L=(q==='en'||q==='ru')?q:(function(){try{var ls=navigator.languages||[navigator.language||''];return ls.some(function(x){return /^(ru|uk|be|kk|ky|uz|tg|hy|az|ka)\b/i.test(x)})?'ru':'en'}catch(e){return 'ru'}})();
  var data=[];
  function esc(s){return String(s||'').replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function draw(){
    document.documentElement.lang=L; document.title=(L==='ru'?'Гиды':'Guides')+' · Property Library Phuket';
    document.getElementById('h').textContent=T[L].h; document.getElementById('s').textContent=T[L].s;
    [].forEach.call(document.querySelectorAll('.lang button'),function(b){b.setAttribute('aria-pressed',b.dataset.l===L?'true':'false')});
    document.getElementById('list').innerHTML=data.map(function(g){var x=g[L]||g.ru;return '<div class="card" id="'+esc(g.id)+'">'+(x.cover?'<a href="'+esc(x.page||x.pdf)+'"><img src="'+esc(x.cover)+'" alt="" loading="lazy"></a>':'')+'<h2><a href="'+esc(x.page||x.pdf)+'">'+esc(x.title)+'</a></h2><p>'+esc(x.lead)+'</p><div class="meta">PDF · '+esc(x.pages)+' '+T[L].pg+'</div><div class="btns"><a class="btn main" href="'+esc(x.pdf)+'" download>'+T[L].dl+'</a><a class="btn" href="'+esc(x.pdf)+'" target="_blank" rel="noopener">'+T[L].op+'</a></div></div>'}).join('');
  }
  [].forEach.call(document.querySelectorAll('.lang button'),function(b){b.addEventListener('click',function(){L=b.dataset.l;try{history.replaceState(null,'','?lang='+L+location.hash)}catch(e){};draw()})});
  fetch('guides.json',{cache:'no-cache'}).then(function(r){return r.json()}).then(function(d){data=d;draw()}).catch(function(){draw()});
  draw();
})();
</script>
</body>
</html>
