# Что НЕ публикуется на property-library.com
#
# 21.09.2026. Третья утечка за сутки заставила посмотреть в корень. Репозиторий
# публичный, и GitHub Pages отдаёт из него ВСЁ подряд — включая исходники
# рабочих инструментов. Проверено запросом к живому сайту:
#
#     property-library.com/tools/reanimation_wave2.py   → 200
#     property-library.com/tools/plp_watch.py           → 200
#     property-library.com/build/gen.mjs                → 200
#     property-library.com/README.md                    → 200
#
# Внутри этих файлов — номера телефонов лидов и коллег (в коде и в пояснениях
# к правкам), устройство системы, имена таблиц и сценариев. Ничего из этого
# посетителю сайта знать не нужно, а конкуренту — тем более.
#
# robots.txt здесь не спасает: он просит поисковики не индексировать, но файл
# по прямой ссылке всё равно отдаётся. Единственный способ — не публиковать.
#
# Правило на будущее: в этом репозитории лежит и сайт, и рабочие инструменты.
# Всё, что не является сайтом, должно быть перечислено ниже.

exclude:
  - tools          # рабочие скрипты: в них номера, ключи таблиц, устройство системы
  - build          # сборка сайта: генераторы, куски вёрстки, заготовки
  - .github        # проверки перед выкаткой
  - README.md
  - add-photo.sh
  - SITE-TODO.md

# Наши страницы — готовый HTML, Jekyll не должен ничего в них подставлять.
# Каталоги ниже он обязан отдавать как есть, вместе с точками в именах.
include:
  - assets
  - img
  - object
  - districts
  - guide
  - offers
