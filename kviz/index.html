<meta name="color-scheme" content="light dark">
<!-- цвет системных полей браузера = фон страницы. Без этого при прокрутке и
     оттягивании из-под страницы проглядывает чужой цвет — кажется, что фон мигает. -->
<meta name="theme-color" content="#f7f6f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0D09" media="(prefers-color-scheme: dark)">
<script>
(function(){
  function paintChrome(){
    try{
      var bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      if(!bg && document.body) bg=getComputedStyle(document.body).backgroundColor;
      if(!bg || bg==='rgba(0, 0, 0, 0)') return;
      var list=document.querySelectorAll('meta[name="theme-color"]');
      for(var i=0;i<list.length;i++) list[i].parentNode.removeChild(list[i]);
      var m=document.createElement('meta'); m.setAttribute('name','theme-color');
      m.setAttribute('content',bg); document.head.appendChild(m);
    }catch(e){}
  }
  /* Кнопка «поделиться»: на телефоне открывает системное меню, на компьютере
     кладёт ссылку в буфер и говорит об этом. Эльнур 07.09: «сайтом надо
     пользоваться, он не просто для красоты». */
  document.addEventListener('click', function(e){
    var b = e.target && e.target.closest && e.target.closest('[data-share]');
    if(!b) return;
    e.preventDefault();
    var path = b.getAttribute('data-share') || location.pathname;
    var url = location.origin + path;
    var title = b.getAttribute('data-share-title') || document.title;
    var done = function(){
      var was = b.innerHTML;   /* 15.09: в кнопке живёт svg-иконка, восстанавливаем разметку целиком */
      b.textContent = '✓ Ссылка скопирована';
      b.classList.add('ok');
      setTimeout(function(){ b.innerHTML = was; b.classList.remove('ok'); }, 2200);
    };
    if(navigator.share){ navigator.share({title:title, url:url}).catch(function(){}); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done).catch(function(){ prompt('Скопируйте ссылку:', url); });
    } else prompt('Скопируйте ссылку:', url);
  });
  window.paintChrome=paintChrome;
  /* Адрес без .html: страницы и так открываются коротким адресом, но если
     человек пришёл по старой ссылке, приводим строку браузера к чистому виду.
     Эльнур 07.09: «мне не нравится html в адресе, я ни у кого её не видел». */
  try{
    var pth=location.pathname;
    if(/\.html$/.test(pth)){
      var clean=pth.replace(/index\.html$/,'').replace(/\.html$/,'');
      if(clean==='') clean='/';
      history.replaceState(null,'',clean+location.search+location.hash);
    }
  }catch(e){}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',paintChrome);
  else paintChrome();
  try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintChrome); }catch(e){}
})();
</script>

      A[s.k] = s.o[+b.dataset.n][0]; TR('q' + (i + 1), s.k + ':' + A[s.k]);
      document.querySelectorAll('.opt').forEach(x => x.classList.remove('on')); b.classList.add('on');
      timing.push(Math.round((Date.now() - tStep) / 1000)); tStep = Date.now();
      setTimeout(() => { i++; render(); }, 260);
    });
  } else {
    $('qwrap').innerHTML = '<div class="q">Куда прислать подборку?</div>' +
      '<div class="who"><img src="img/elnur.jpg" alt=""><span><b>Эльнур Ханкишиев</b>, основатель Property Library. Пришлю лично цены и расчёт доходности.</span></div>' +
      '<form id="f" novalidate><input id="nm" placeholder="Ваше имя" autocomplete="name" required aria-required="true">' +
      '<div class="phrow"><input id="cc" type="tel" inputmode="tel" list="ccl" aria-label="Код страны" autocomplete="tel-country-code" value="' + ccGuess() + '">' +
      '<input id="pn" type="tel" inputmode="tel" placeholder="Номер телефона" autocomplete="tel-national" aria-describedby="phh err"></div>' +
      '<datalist id="ccl">' + CCL.map(c => '<option value="+' + c[0] + '">' + c[1] + '</option>').join('') + '</datalist>' +
      '<input id="ph" type="hidden">' +
      '<div class="fh" id="phh">Код страны подставлен сам, его можно поменять. Номер без кода, например 900 123 45 67</div>' +
      '<div class="chan"><button type="button" class="on" data-c="whatsapp">WhatsApp</button><button type="button" data-c="telegram">Telegram</button></div>' +
      '<label class="tgf" id="tgf" hidden><input id="tg" placeholder="Ник в Telegram, если есть" autocomplete="off" autocapitalize="off" spellcheck="false"><span class="fh">Необязательно. После заявки нажмите «Продолжить в Telegram», и мы сразу увидим вас там.</span></label>' +
      '<input class="hp" id="co" tabindex="-1" autocomplete="off" aria-hidden="true">' +
      '<div class="err" id="err"></div><button class="cta" type="submit">Получить подборку</button></form>' +
      '<p class="note">Отправляя заявку, вы соглашаетесь на обработку данных и их передачу рекламным партнёрам для подбора предложений. Сообщения от Property Library Phuket придут в WhatsApp или Telegram только по этому запросу. <a href="/privacy" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">Политика конфиденциальности</a></p>';
    A.channel = 'whatsapp'; TR('form_view');
    $('pn').addEventListener('paste', () => pasted = true);
    const sync = () => { $('ph').value = phoneJoin($('cc').value, $('pn').value); $('err').textContent = ''; $('pn').removeAttribute('aria-invalid'); };
    ['input','change','blur'].forEach(ev => { $('cc').addEventListener(ev, sync); $('pn').addEventListener(ev, sync); }); sync();
    document.querySelectorAll('.chan button').forEach(b => b.onclick = () => {
      document.querySelectorAll('.chan button').forEach(x => x.classList.remove('on')); b.classList.add('on'); A.channel = b.dataset.c; TR('channel', A.channel);
      $('tgf').hidden = A.channel !== 'telegram'; });
    $('f').addEventListener('submit', e => { e.preventDefault(); send(); });

  }
}

function send(){
  /* 12.10.2026 Эльнур: «как у него вообще получилось ввести неверный номер?» (7011888018, Казахстан без +7: форма
     пропустила 10 цифр, приёмник тоже, Wazzup отбил, а человек увидел «Заявка принята»). Теперь: (1) номер проверяет
     общий phone.js (тот же, что у приёмника); (2) форма ЖДЁТ ответ приёмника, а он сначала пишет человеку в WhatsApp;
     (3) «Заявка принята» и событие Lead в Meta — только после ok от приёмника. */
  if (busy) return;
  if ($('co').value) { finish({ ok: true, sent: false }); return; }   // робот заполнил скрытое поле: показываем успех, заявку не шлём
  /* 16.10.2026: имя обязательно — без имени первое касание не уходит (решение №299 «без имени не шлём»), лид повисал без ответа */
  const nm = $('nm').value.trim();
  if (nm.replace(/[^A-Za-zА-Яа-яЁё]/g, '').length < 2) { $('err').textContent = 'Как к вам обращаться? Укажите имя.'; $('nm').setAttribute('aria-invalid', 'true'); try { $('nm').focus(); } catch (e) {} TR('name_err'); return; }
  const raw = $('ph').value;
  const chk = phoneCheck(raw);
  if (!chk.ok) { $('err').textContent = chk.hint || 'Проверьте номер: код страны и все цифры.'; $('pn').setAttribute('aria-invalid', 'true'); try { $('pn').focus(); } catch (e) {} TR('phone_err'); return; }
  const d = chk.digits; PH = '+' + d; AS = '';
  const p = new URLSearchParams(location.search), utm = {};
  ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','utm_id','fbclid','gclid'].forEach(k => { if (p.get(k)) utm[k] = p.get(k); });
  const lead = { source:'website', funnel:'ads_quiz', object_id:C.id, object_name:C.name, name:$('nm').value.trim(), phone:'+' + d, lid:LID,
    contact_pref:A.channel, plan:A.plan, goal:VAL('goal'), budget:VAL('budget'), srok:VAL('when'), quiz_v:2,
    message:'Квиз ' + C.name + ': ' + C.Q.map(s => VAL(s.k)).filter(Boolean).join(' · '),
    page:location.href, utm, quiz:A,
    quality:{ secs_total:Math.round((Date.now() - T0) / 1000), secs_per_step:timing, pasted_phone:pasted, phone_fixed:chk.fixed || '',
      all_first_answers:C.Q.every(s => A[s.k] === s.o[0][0]) } };
  lead.channel_pref = A.channel === 'telegram' ? 'telegram' : 'whatsapp';
  /* ник в Telegram (необязательно): приёмник sitelead.mjs читает tg_username и сам убирает @ и t.me/ */
  const tgNick = A.channel === 'telegram' && $('tg') ? $('tg').value.trim().slice(0, 64) : '';
  /* 20.10.2026 го Эльнура: номер обязателен, ник необязательный (отменяет 15.10 «ник и номер обязательно»).
     Telegram человека бот узнаёт сам по кнопке «Продолжить в Telegram» с кодом заявки (заявка 14139: в поле ника вписали номер). */
  if (tgNick) lead.tg_username = tgNick;
  try { if (window.PLPTrack) lead.track = PLPTrack.lead(); } catch (e) {}
  /* 16.10.2026 CAPI: приёмник шлёт серверный Lead в Meta только при согласии «Принять» (как пиксель, PDPA) */
  try { lead.consent = (window.PLPConsent && PLPConsent.get()) || 'none'; } catch (e) { lead.consent = 'none'; }
  /* 20.10.2026 го Эльнура «надо чтобы работало… Европа тоже нужна»: согласие берём в самой форме (строка под кнопкой).
     form_consent:true — приёмник шлёт серверный Lead в Meta и без «Принять» на плашке, но без куки _fbp/_fbc. Пиксель — по-прежнему только после «Принять». */
  lead.form_consent = true;
  TR('submit');
  const btn = document.querySelector('#f .cta'), label = btn ? btn.textContent : '';
  busy = true; if (btn) { btn.disabled = true; btn.textContent = 'Отправляем…'; } $('err').textContent = '';
  const unlock = () => { busy = false; if (btn) { btn.disabled = false; btn.textContent = label; } };
  /* ждём не дольше 15 с (обычно 6–10: приёмник сам пишет человеку). Не дождались — заявка почти наверняка дошла,
     показываем «напишем в ближайшее время»; повтор с тем же LID приёмник не задвоит. */
  const ctl = window.AbortController ? new AbortController() : null;
  const timer = setTimeout(() => { if (ctl) ctl.abort(); }, 15000);
  const isTest = /^(66)?9009990|^669000000|^900999/.test(d);
  /* text/plain — как у главной (index.html, sendLead): без предзапроса CORS, приёмник разбирает строку сам (sitelead.mjs стр. 24);
     keepalive — закрыл вкладку, пока ждёт, заявка всё равно дойдёт */
  fetch('https://hub.property-library.com/webhook/site-lead?key=ee8efec5c8c30f8a3f9d1c7b7c00739381a674b7', { method:'POST', headers:{'Content-Type':'text/plain'},
        body:JSON.stringify(lead), keepalive:true, signal: ctl ? ctl.signal : undefined })
    .then(r => r.json())
    .then(r => {
      clearTimeout(timer);
      if (r && r.ok === false && r.field === 'phone') { unlock(); $('err').textContent = r.hint || 'Проверьте номер: код страны и все цифры.'; $('pn').setAttribute('aria-invalid', 'true'); return; }
      if (!isTest) {   // тестовые номера (то же правило, что ТЕСТ в реклама_сводка.py) не считаем лидом в рекламе
        const ev = r && r.event_id ? { eventID: r.event_id } : undefined;
        try { if (window.fbq) fbq('track', 'Lead', { content_name: C.name, content_category: 'kviz' }, ev); } catch (e) {}
        try { if (window.gtag) gtag('event', 'generate_lead', { lead_source: 'kviz', item_name: C.name }); } catch (e) {}
      }
      finish(r || { ok: true, sent: false });
    })
    .catch(() => { clearTimeout(timer); finish({ ok: true, sent: false, late: true }); });
}

function finish(r){
  r = r || {}; busy = false; TR(r.sent ? 'lead_sent' : 'lead_ok', r.channel || A.channel);
  /* 15.10.2026 Эльнур: «поставим в квизе кнопку, чтобы они сами нам написали, так быстрее, и нужна обязательно мотивация».
     Мотивация — из горячих офферов и objects.current_promo (15.10). Кнопка той же сети, что выбрал человек, стоит первой.
     Рабочий Telegram Эльнура — t.me/elnur_kh (канон 141 tg_link_is_work_account), WhatsApp — рабочий 66955492587. */
  const MOT = {
    vibe2:'Напишите, и закрепим за вами квартиру до старта 28 октября и мебель с техникой в подарок.',
    kuartz:'Напишите, и закрепим скидку клиента Property Library: от 200 до 400 тыс. бат по типу квартиры и ещё 5%.',
    fizz:'Напишите, и закрепим скидку клиента Property Library: от 200 до 500 тыс. бат по типу квартиры и ещё 5%.',
    eden:'Напишите, и пришлём планировки и расчёт рассрочки на 5 лет.',
    zero:'Напишите, и пришлём расчёт гарантированного дохода 10%.' };
  /* 15.10.2026 Эльнур: кнопка называется как бонус (бонус = мотивация выше), ведёт к тому, за кем закреплён лид.
     16.10.2026: кто — из ответа приёмника (r.assigned_to); нет ответа — запасной вариант по чётности. Подпись без имени
     (Эльнур: «одни карточки на меня, другие на Дарью, и всё»). */
  if (r.assigned_to === 'elnur' || r.assigned_to === 'daria') AS = r.assigned_to;
  const wkey = Object.keys(P).find(k => P[k] === C), ref = r.client_code || r.phone || PH || '';
  /* 19.10.2026 Эльнур «да, го»: назначенного не узнали (приёмник не ответил) — номер Эльнура, не чётность. */
  const who = AS || 'elnur', W = WRK[who];
  const msg = encodeURIComponent('Здравствуйте! Хочу забрать бонус по ' + C.name + '.' + (ref ? ' Заявка ' + ref : ''));
  const icWA = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>';
  const icTG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.9 4.3 18.7 19.4c-.2 1-.9 1.3-1.7.8l-4.8-3.6-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.9 8.9-8c.4-.3-.1-.5-.6-.2l-11 6.9-4.7-1.5c-1-.3-1-1 .2-1.5l18.5-7.1c.9-.3 1.6.2 1.4 1.3z"/></svg>';
  /* 19.10.2026 Эльнур «да, го» (путь_лида_и_бан_1910.md): за 5 дней 11 заявок, нажатий WhatsApp 1, Telegram 1, бот 0 —
     на экране одна главная кнопка в выбранный мессенджер, остальное мелко под «Другие способы». */
  const tgFirst = (r.channel || A.channel) === 'telegram';
  const bWA = '<a class="wa" data-ev="click_wa_write" href="https://wa.me/' + W.wa + '?text=' + msg + '" target="_blank" rel="noopener">' + icWA + 'Получить бонус в WhatsApp</a>';
  const bTG = '<a class="tg" data-ev="click_tg_write" href="https://t.me/' + W.tg + '?text=' + msg + '" target="_blank" rel="noopener">' + icTG + 'Получить бонус в Telegram</a>';
  const lWA = '<a class="lnk" data-ev="click_wa_write" href="https://wa.me/' + W.wa + '?text=' + msg + '" target="_blank" rel="noopener">Написать в WhatsApp</a>';
  const lTG = '<a class="lnk" data-ev="click_tg_write" href="https://t.me/' + W.tg + '?text=' + msg + '" target="_blank" rel="noopener">Написать в Telegram</a>';
  /* 20.10.2026 го Эльнура: выбрал Telegram и приёмник дал код заявки (r.tg_start) — главная кнопка «Продолжить в Telegram»
     ведёт в @elnurphuket_bot с кодом: бот узнаёт человека, связывает Telegram с номером заявки, ведущему уходит карточка,
     человеку бот отвечает по его квизу. Кода нет (приёмник не ответил) — как раньше, в рабочий Telegram с набранным текстом. */
  const botMain = tgFirst && r.tg_start;
  const bBOT = '<a class="tg" data-ev="click_tg_bot" href="' + r.tg_start + '" target="_blank" rel="noopener">' + icTG + 'Продолжить в Telegram</a>';
  const write = '<p class="mot">' + (MOT[wkey] || 'Напишите, и пришлём расчёт под ваш бюджет.') + '</p>' +
    '<div class="wr">' + (botMain ? bBOT : tgFirst ? bTG : bWA) + '</div>' +
    (botMain ? '<p class="wrh">Откроется Telegram, нажмите там «Старт»</p>' : '<p class="wrh">Сообщение уже набрано, останется нажать «Отправить»</p>');
  $('quiz').hidden = true; $('s0').hidden = true; $('foot0').hidden = true;
  const ch = (r.channel || A.channel) === 'telegram' ? 'Telegram' : 'WhatsApp', key = Object.keys(P).find(k => P[k] === C);
  $('done').innerHTML =
    '<div class="pj"><div class="ph0"><img class="bg" src="img/' + C.hero + '.webp" alt=""' + (C.heroPos || C.heroSt ? ' style="' + (C.heroPos ? 'object-position:' + C.heroPos + ';' : '') + (C.heroSt || '') + '"' : '') + '></div>' +
    '<div class="pt"><span class="ok">Заявка принята</span><h2>' + C.name + ', ' + (C.place || 'Карон') + '</h2>' +
    /* 15.10.2026: без обещания «напишу в ближайшее время»; главный путь к расчёту — бот в Telegram.
       «Написал вам» остаётся только когда приёмник подтвердил отправку (r.sent). */
    (r.sent ? '<p>Написал вам в ' + ch + (r.phone ? ' на ' + r.phone : '') + ', проверьте сообщения. Быстрее всего заберите бонус сами: кнопка ниже.</p>'
            : '<p>Я напишу вам в выбранный мессенджер. Быстрее всего заберите бонус сами: кнопка ниже.</p>') + '</div></div>' + write +
    '<div class="facts">' + C.facts.map(f => '<div><b>' + f[0] + '</b>' + f[1] + '</div>').join('') + '</div>' +
    '<div class="gal">' + C.gal.map(g => { const [n, st] = g.split('|'); return '<i class="gi"><img src="img/' + n + '.webp" alt=""' + (st ? ' style="' + st + '"' : '') + '></i>'; }).join('') + '</div>' +
    /* 13.10.2026: ссылка в бот несёт метку заявки (r.tg_start), бот по ней узнаёт Telegram человека.
       19.10.2026: бот, второй мессенджер и канал — мелкими ссылками под «Другие способы»; обложка презентации убрана с экрана
       (клики 0 с 14.10), презентацию по-прежнему отдаёт бот. */
    '<details class="alt"><summary>Другие способы</summary><div class="lnks">' + (tgFirst ? lWA : lTG) + (botMain ? lTG : '') +
      (botMain ? '' : '<a class="lnk" href="' + (r.tg_start || ('https://t.me/elnurphuket_bot?start=' + C.bot)) + '" target="_blank" rel="noopener">Получить расчёт в Telegram-боте</a>') +
      '<a class="lnk" href="' + POST[key] + '" target="_blank" rel="noopener">Читать разбор ' + C.name + ' в Telegram</a></div></details>';
  $('done').hidden = false; scrollTo(0, 0);
  $('done').onclick = e => { const a = e.target.closest && e.target.closest('a'); if (!a) return; const h = a.getAttribute('href') || '';
    if (a.dataset.ev) { TR(a.dataset.ev, who); if (window.PLPTrack) PLPTrack.flush(false); return; }
    TR(a.classList.contains('cover') ? 'cta_cover' : /elnurphuket_bot/.test(h) ? 'cta_bot' : /t\.me/.test(h) ? 'cta_channel' : 'cta_sheet', h.replace(/^https?:\/\//, '').slice(0, 60)); if (window.PLPTrack) PLPTrack.flush(false); };
}

/* Пружина при оттягивании вниз (как в приложениях): тянется с сопротивлением и возвращается */
(function(){
  const w = document.querySelector('.wrap'); let y0 = null, dy = 0, x0 = 0;
  addEventListener('touchstart', e => { if (scrollY <= 0) { y0 = e.touches[0].clientY; w.style.transition = 'none'; } }, { passive:true });
  addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive:true });
  addEventListener('touchmove', e => { if (y0 === null) return; if (Math.abs(e.touches[0].clientX - x0) > Math.abs(e.touches[0].clientY - y0)) return; dy = Math.max(0, e.touches[0].clientY - y0);
    w.style.transform = dy ? 'translateY(' + Math.round(60 * (1 - Math.exp(-dy / 120))) + 'px)' : ''; }, { passive:true });
  addEventListener('touchend', () => { if (y0 === null) return; y0 = null; dy = 0;
    w.style.transition = 'transform .45s cubic-bezier(.2,1.4,.4,1)'; w.style.transform = ''; });
})();

$('back').onclick = () => { if (i) { i--; render(); } };
window.addEventListener('hashchange', boot);
boot();
