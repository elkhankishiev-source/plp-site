<!-- цвет системных полей браузера = фон страницы. Без этого при прокрутке и
     оттягивании из-под страницы проглядывает чужой цвет — кажется, что фон мигает. -->
<meta name="theme-color" content="#f7f6f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0D09" media="(prefers-color-scheme: dark)">
<script>
(function(){
  function paintChrome(){
    try{
      var bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      if(!bg && document.body) bg=getComputedStyle(document.body).backgroundColor;
      if(!bg || bg==='rgba(0, 0, 0, 0)') return;
      var list=document.querySelectorAll('meta[name="theme-color"]');
      for(var i=0;i<list.length;i++) list[i].parentNode.removeChild(list[i]);
      var m=document.createElement('meta'); m.setAttribute('name','theme-color');
      m.setAttribute('content',bg); document.head.appendChild(m);
    }catch(e){}
  }
  /* Кнопка «поделиться»: на телефоне открывает системное меню, на компьютере
     кладёт ссылку в буфер и говорит об этом. Эльнур 07.09: «сайтом надо
     пользоваться, он не просто для красоты». */
  document.addEventListener('click', function(e){
    var b = e.target && e.target.closest && e.target.closest('[data-share]');
    if(!b) return;
    e.preventDefault();
    var path = b.getAttribute('data-share') || location.pathname;
    var url = location.origin + path;
    var title = b.getAttribute('data-share-title') || document.title;
    var done = function(){
      var was = b.innerHTML;   /* 15.09: в кнопке живёт svg-иконка, восстанавливаем разметку целиком */
      b.textContent = '✓ Ссылка скопирована';
      b.classList.add('ok');
      setTimeout(function(){ b.innerHTML = was; b.classList.remove('ok'); }, 2200);
    };
    if(navigator.share){ navigator.share({title:title, url:url}).catch(function(){}); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done).catch(function(){ prompt('Скопируйте ссылку:', url); });
    } else prompt('Скопируйте ссылку:', url);
  });
  window.paintChrome=paintChrome;
  /* Адрес без .html: страницы и так открываются коротким адресом, но если
     человек пришёл по старой ссылке, приводим строку браузера к чистому виду.
     Эльнур 07.09: «мне не нравится html в адресе, я ни у кого её не видел». */
  try{
    var pth=location.pathname;
    if(/\.html$/.test(pth)){
      var clean=pth.replace(/index\.html$/,'').replace(/\.html$/,'');
      if(clean==='') clean='/';
      history.replaceState(null,'',clean+location.search+location.hash);
    }
  }catch(e){}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',paintChrome);
  else paintChrome();
  try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintChrome); }catch(e){}
})();
</script>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--f);background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* Вопросы */
.card{background:var(--paper);border-radius:22px;padding:20px 18px}

const POST = { kuartz:'https://t.me/property_library_phuket', vibe2:'https://t.me/property_library_phuket', fizz:'https://t.me/property_library_phuket', standard:'https://t.me/property_library_phuket', eden:'https://t.me/property_library_phuket', zero:'https://t.me/property_library_phuket' }; /* ссылки на посты-разборы: подставить, когда выйдут */
const $ = id => document.getElementById(id);
let C, A, i, T0, tStep, timing, pasted;

function boot(){
  const key = (new URLSearchParams(location.search).get('p') || location.hash.slice(1) || 'kuartz').toLowerCase(); C = P[key] || P.kuartz;
  Object.keys(P).forEach(k => { const e = $('sw-' + k); if (e) e.classList.toggle('on', P[k] === C); });
  A = {}; i = 0; timing = []; pasted = false; T0 = Date.now();
  $('quiz').hidden = true; $('done').hidden = true; $('s0').hidden = false;
  $('s0').innerHTML = '<div class="start"><div class="ph0"><img class="bg" src="img/' + C.hero + '.webp" alt=""' + (C.heroPos || C.heroSt ? ' style="' + (C.heroPos ? 'object-position:' + C.heroPos + ';' : '') + (C.heroSt || '') + '"' : '') + '></div>' +
    '<div class="logo"><img src="img/plp-logo-ink.webp" alt="Property Library Phuket"></div>' +
    '<div class="t"><h1>' + C.h1 + '</h1><p>' + C.sub + '</p>' +
    '<button class="cta" id="start">Получить подборку</button><small>' + C.foot + '</small></div></div>';
  $('start').onclick = () => { $('s0').hidden = true; $('quiz').hidden = false; tStep = Date.now(); render(); scrollTo(0, 0); };
}

function render(){
  const Q = C.Q, total = Q.length + 1;
  const left = Q.length - i;
  $('stepn').textContent = i < Q.length ? 'Вопрос ' + (i + 1) + ' из ' + Q.length + (left > 1 ? ' · ещё ' + (left - 1) + ' и подборка готова' : ' · последний вопрос') : 'Подборка готова на 100%';
  $('gift').innerHTML = '<b>' + (i < Q.length ? 'Бонусы после опроса' : 'Пришлю вам') + '</b>' + C.gifts.map(g => '<span>🎁 ' + g + '</span>').join('');
  $('bar').style.width = Math.round((i + 1) / total * 100) + '%'; $('back').hidden = !i;
  if (i < Q.length) {
    const s = Q[i], pics = !!s.o[0][1];
    $('qwrap').style.animation='none'; void $('qwrap').offsetWidth; $('qwrap').style.animation='';
    $('qwrap').innerHTML = '<div class="q">' + s.q + '</div><div class="opts' + (pics ? ' pics' : '') + '">' +
      s.o.map((o, n) => '<button class="opt' + (A[s.k] === o[0] ? ' on' : '') + '" data-n="' + n + '">' +
        (o[1] ? '<i class="ph"><img' + (s.fit ? ' class="fit"' : '') + ' src="img/' + o[1] + '.webp" alt=""' + (o[2] ? ' style="' + o[2] + '"' : '') + '></i>' : '') + '<span>' + o[0] + '</span></button>').join('') + '</div>';
    document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      A[s.k] = s.o[+b.dataset.n][0];
      document.querySelectorAll('.opt').forEach(x => x.classList.remove('on')); b.classList.add('on');
      timing.push(Math.round((Date.now() - tStep) / 1000)); tStep = Date.now();
      setTimeout(() => { i++; render(); }, 260);
    });
  } else {
    $('qwrap').innerHTML = '<div class="q">Куда прислать подборку?</div>' +
      '<div class="who"><img src="img/elnur.jpg" alt=""><span><b>Эльнур Ханкишиев</b>, основатель Property Library. Пришлю лично цены и расчёт доходности.</span></div>' +
      '<form id="f" novalidate><input id="nm" placeholder="Ваше имя" autocomplete="name">' +
      '<input id="ph" type="tel" inputmode="tel" placeholder="Телефон с кодом страны, +7…" autocomplete="tel">' +
      '<div class="chan"><button type="button" class="on" data-c="whatsapp">WhatsApp</button><button type="button" data-c="telegram">Telegram</button></div>' +
      '<input class="hp" id="co" tabindex="-1" autocomplete="off" aria-hidden="true">' +
      '<div class="err" id="err"></div><button class="cta" type="submit">Получить подборку</button></form>' +
      '<p class="note">Оставляя номер, вы соглашаетесь, что Property Library Phuket свяжется с вами по этому запросу.</p>';
    A.channel = 'whatsapp';
    $('ph').addEventListener('paste', () => pasted = true);
    document.querySelectorAll('.chan button').forEach(b => b.onclick = () => {
      document.querySelectorAll('.chan button').forEach(x => x.classList.remove('on')); b.classList.add('on'); A.channel = b.dataset.c; });
    $('f').addEventListener('submit', e => { e.preventDefault(); if (send()) finish(); });
  }
}

function send(){
  const phone = $('ph').value.replace(/[^\d+]/g, ''), d = phone.replace(/\D/g, '');
  if ($('co').value) return true;   // робот заполнил скрытое поле: показываем успех, заявку не шлём
  if (d.length < 10 || d.length > 15) { $('err').textContent = 'Проверьте номер: нужен код страны, например +7 или +66'; return false; }
  const p = new URLSearchParams(location.search), utm = {};
  ['utm_source','utm_medium','utm_campaign','utm_content','utm_term','fbclid','gclid'].forEach(k => { if (p.get(k)) utm[k] = p.get(k); });
  const lead = { source:'website', funnel:'ads_quiz', object_id:C.id, object_name:C.name, name:$('nm').value.trim(), phone,
    contact_pref:A.channel, goal:A.goal, budget:A.plan, message:'Квиз ' + C.name + ': ' + Object.values(A).filter(x => x !== A.channel).join(' · '),
    page:location.href, utm, quiz:A,
    quality:{ secs_total:Math.round((Date.now() - T0) / 1000), secs_per_step:timing, pasted_phone:pasted,
      all_first_answers:C.Q.every(s => A[s.k] === s.o[0][0]), agent:/агент/i.test(A.who || '') } };
  lead.channel_pref = A.channel === 'telegram' ? 'telegram' : 'whatsapp';
  try { fetch('https://hub.property-library.com/webhook/site-lead?key=ee8efec5c8c30f8a3f9d1c7b7c00739381a674b7', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(lead), keepalive:true }).catch(() => {}); } catch (e) {}
  try { if (window.fbq) fbq('track', 'Lead', { content_name: C.name, content_category: 'kviz' }); } catch (e) {}
  return true;
}

function finish(){
  $('quiz').hidden = true;
  const ch = A.channel === 'telegram' ? 'Telegram' : 'WhatsApp', key = Object.keys(P).find(k => P[k] === C);
  $('done').innerHTML =
    '<div class="pj"><div class="ph0"><img class="bg" src="img/' + C.hero + '.webp" alt=""' + (C.heroPos || C.heroSt ? ' style="' + (C.heroPos ? 'object-position:' + C.heroPos + ';' : '') + (C.heroSt || '') + '"' : '') + '></div>' +
    '<div class="pt"><span class="ok">Заявка принята</span><h2>' + C.name + ', ' + (C.place || 'Карон') + '</h2>' +
    '<p>Напишу вам в ' + ch + ' в ближайшие минуты' + (A.plan ? ', подборка: ' + A.plan.toLowerCase() : '') + '.</p></div></div>' +
    '<div class="facts">' + C.facts.map(f => '<div><b>' + f[0] + '</b>' + f[1] + '</div>').join('') + '</div>' +
    '<div class="gal">' + C.gal.map(g => { const [n, st] = g.split('|'); return '<i class="gi"><img src="img/' + n + '.webp" alt=""' + (st ? ' style="' + st + '"' : '') + '></i>'; }).join('') + '</div>' +
    '<a class="cta" href="' + POST[key] + '" target="_blank" rel="noopener">Читать разбор ' + C.name + ' в Telegram</a>' +
    '<a class="cta2" href="https://t.me/elnurphuket_bot?start=' + C.bot + '" target="_blank" rel="noopener">Получить расчёт в Telegram</a>' +
    '<a class="lnk" href="' + C.sheet + '" target="_blank" rel="noopener">Открыть лист проекта</a>';
  $('done').hidden = false; scrollTo(0, 0);
}

/* Пружина при оттягивании вниз (как в приложениях): тянется с сопротивлением и возвращается */
(function(){
  const w = document.querySelector('.wrap'); let y0 = null, dy = 0, x0 = 0;
  addEventListener('touchstart', e => { if (scrollY <= 0) { y0 = e.touches[0].clientY; w.style.transition = 'none'; } }, { passive:true });
  addEventListener('touchstart', e => { x0 = e.touches[0].clientX; }, { passive:true });
  addEventListener('touchmove', e => { if (y0 === null) return; if (Math.abs(e.touches[0].clientX - x0) > Math.abs(e.touches[0].clientY - y0)) return; dy = Math.max(0, e.touches[0].clientY - y0);
    w.style.transform = dy ? 'translateY(' + Math.round(60 * (1 - Math.exp(-dy / 120))) + 'px)' : ''; }, { passive:true });
  addEventListener('touchend', () => { if (y0 === null) return; y0 = null; dy = 0;
    w.style.transition = 'transform .45s cubic-bezier(.2,1.4,.4,1)'; w.style.transform = ''; });
})();

$('back').onclick = () => { if (i) { i--; render(); } };
window.addEventListener('hashchange', boot);
boot();
</script>
