<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Персональное предложение · Property Library Phuket</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="icon" href="img/brand/plp-mark-ink.png">
<style>
:root{
  --ink:#22251C; --paper:#FBFBF7; --muted:#6B6B63; --line:#E6E6DE;
  --green:#D2D5B3; --green-deep:#5F6242; --shadow:0 18px 44px rgba(20,18,14,.10);
}
*{box-sizing:border-box}
body{margin:0;background:#F4F4EE;color:var(--ink);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 60px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:22px}
.top img{width:30px;height:30px;border-radius:7px;display:block}
.top b{font-size:.95rem;letter-spacing:.01em}
.top span{margin-left:auto;font-size:.72rem;color:var(--muted);text-align:right;line-height:1.35}

.card{position:relative;background:var(--paper);border:1px solid var(--line);
  border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
/* Водяной знак: наш логотип по всей странице. Скриншот или пересылка сохраняют его. */
.card::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:url('img/brand/plp-mark-ink.png');
  background-repeat:repeat;background-size:132px;opacity:.045;
  transform:rotate(-18deg) scale(1.5);transform-origin:center}
.card>*{position:relative;z-index:1}

.head{padding:26px 26px 20px;border-bottom:1px solid var(--line)}
.kicker{display:inline-block;font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;
  color:var(--green-deep);font-weight:700;margin-bottom:9px}
h1{margin:0 0 6px;font-size:clamp(1.35rem,3.4vw,1.9rem);line-height:1.18}
.sub{margin:0;color:var(--muted);font-size:.92rem}

.body{padding:22px 26px 26px}
.row{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));margin-bottom:22px}
.cell{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 14px}
.cell b{display:block;font-size:1.02rem;font-variant-numeric:tabular-nums}
.cell span{display:block;font-size:.71rem;color:var(--muted);margin-top:3px;line-height:1.3}

h2{font-size:.74rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
  margin:26px 0 10px;font-weight:700}
p.text{margin:0;font-size:.94rem;line-height:1.6}
.plan{background:#fff;border-left:3px solid var(--green);border-radius:0 12px 12px 0;
  padding:13px 15px;font-size:.9rem;line-height:1.55}

.note{margin-top:24px;padding:14px 16px;background:rgba(210,213,179,.2);
  border-radius:12px;font-size:.86rem;line-height:1.5}
.foot{margin-top:22px;padding-top:18px;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:.82rem;color:var(--muted)}
.foot a{color:var(--ink);text-decoration:none;border-bottom:1px solid rgba(0,0,0,.16)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--ink);color:#fff;border:0;border-radius:999px;padding:12px 22px;
  font-size:.9rem;font-weight:600;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid rgba(10,10,10,.16)}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}

.shots{display:grid;gap:8px;grid-template-columns:2fr 1fr 1fr;margin-bottom:20px}
.shots img{width:100%;height:100%;object-fit:cover;border-radius:11px;display:block;min-height:96px}
.shots img:first-child{grid-row:span 2;min-height:210px}
@media(max-width:560px){.shots{grid-template-columns:1fr 1fr}.shots img:first-child{grid-column:span 2;grid-row:auto}}
.picked{display:flex;align-items:baseline;gap:10px;background:rgba(210,213,179,.28);
  border-radius:12px;padding:11px 14px;margin-bottom:18px}
.picked span{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--green-deep)}
.picked b{font-size:.98rem}
.buy{display:flex;flex-direction:column;gap:7px}
.buyrow{display:flex;align-items:baseline;gap:10px;background:#fff;border:1px solid var(--line);
  border-radius:11px;padding:10px 13px}
.buyrow b{font-size:.92rem;flex:0 0 auto}
.buyrow span{font-size:.83rem;color:var(--muted);flex:1 1 auto}
.buyrow u{text-decoration:none;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.hint{margin:9px 0 0;font-size:.78rem;color:var(--muted);line-height:1.45}
@media(max-width:520px){.buyrow{flex-wrap:wrap;gap:4px 10px}.buyrow span{flex:1 0 100%}}
.msg{max-width:520px;margin:14vh auto;text-align:center;padding:0 20px}
.msg h1{font-size:1.3rem;margin-bottom:10px}
.msg p{color:var(--muted);font-size:.94rem}
.skel{color:var(--muted);font-size:.9rem;padding:40px 26px;text-align:center}
@media print{body{background:#fff}.card{box-shadow:none}.cta{display:none}}
</style>
</head>
<body>
<div class="wrap" id="root">
  <div class="skel">Загружаем предложение…</div>
</div>

<script>
(function(){
  var API='https://proplib.app.n8n.cloud/webhook/uk-owner';
  var root=document.getElementById('root');
  var token=(location.hash||'').replace(/^#/,'').trim();

  function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function baht(n){
    if(n==null||n==='') return null;
    n=Number(n)||0;
    if(n>=1e6) return '฿'+(n/1e6).toFixed(n%1e6?1:0).replace('.',',')+' млн';
    return '฿'+Math.round(n).toLocaleString('ru-RU').replace(/ /g,' ');
  }
  function dt(x){ if(!x) return null; var d=new Date(x);
    return isNaN(d)?null:d.toLocaleDateString('ru-RU',{day:'2-digit',month:'long',year:'numeric'}); }

  function fail(title, text){
    root.innerHTML='<div class="msg"><h1>'+esc(title)+'</h1><p>'+esc(text)+'</p>'+
      '<p style="margin-top:18px"><a class="btn ghost" href="index.html">На главную</a></p></div>';
  }

  if(!token){ fail('Ссылка неполная','Откройте предложение по ссылке, которую прислал менеджер.'); return; }

  fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'offer_read',offer:token})})
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d||!d.ok){
        if(d&&d.reason==='expired') return fail('Срок предложения истёк','Напишите менеджеру — соберём новое, цены могли измениться.');
        if(d&&d.reason==='revoked') return fail('Предложение отозвано','Свяжитесь с менеджером, он пришлёт актуальное.');
        return fail('Предложение не найдено','Проверьте ссылку целиком — возможно, она скопирована не полностью.');
      }
      render(d);
    })
    .catch(function(){ fail('Не удалось загрузить','Проверьте соединение и обновите страницу.'); });

  function render(d){
    var o=d.object||{};
    /* сотрудник отметил, что показывать: пусто — показываем всё */
    var B=Array.isArray(d.blocks)&&d.blocks.length?d.blocks:null;
    function on(k){ return !B || B.indexOf(k)>=0; }
    var price=baht(o.price_from);
    var area=(o.area_min&&o.area_max&&o.area_min!==o.area_max)?(o.area_min+'–'+o.area_max+' м²')
             :(o.area_min?o.area_min+' м²':null);
    var beds=(o.beds_min&&o.beds_max&&o.beds_min!==o.beds_max)?(o.beds_min+'–'+o.beds_max)
             :(o.beds_min?String(o.beds_min):null);
    var hand=dt(o.handover);
    var cells=[];
    if(price) cells.push(['от '+price,
      (o.list_price && o.price_from && Number(o.price_from)<Number(o.list_price))
        ? 'ваша цена, прайс '+baht(o.list_price) : 'цена от застройщика']);
    if(area)  cells.push([area,'площадь']);
    if(beds)  cells.push([beds,'спальни']);
    if(hand)  cells.push([hand,'срок сдачи']);
    else if(o.stage) cells.push([esc(o.stage).slice(0,28),'стадия']);
    if(o.beach_m!=null) cells.push([(o.beach_m>=1000?(o.beach_m/1000).toFixed(1).replace('.0','')+' км':o.beach_m+' м'),'до пляжа']);
    if(o.roi!=null && on('yield')) cells.push(['~'+o.roi+'%','ориентир доходности']);

    /* Сотрудник мог выбрать конкретный тип — тогда он идёт первой строкой. */
    var pickedUnit=(d.custom&&d.custom.unit)?String(d.custom.unit):'';

    /* Что вообще можно купить в проекте: планировки застройщика или тиры прайса. */
    var buyRows=[];
    /* цену «от» к названной планировке берём из прайса по числу спален */
    var fromByBeds={};
    (Array.isArray(o.tiers)?o.tiers:[]).forEach(function(t){
      if(t.bedrooms==null||!t.price_from_thb) return;
      if(!fromByBeds[t.bedrooms]||t.price_from_thb<fromByBeds[t.bedrooms]) fromByBeds[t.bedrooms]=t.price_from_thb;
    });
    /* та же оговорка, что и на сайте: одинаковую цену нескольким планировкам
       с равным числом спален не приписываем — это цена группы, не типа */
    var perBeds={};
    (Array.isArray(o.units)?o.units:[]).forEach(function(u){ perBeds[u.beds]=(perBeds[u.beds]||0)+1; });
    (Array.isArray(o.units)?o.units:[]).forEach(function(u){
      var pf=u.from||u.price_from||(perBeds[u.beds]===1?fromByBeds[u.beds]:null);
      buyRows.push([u.name||'', [u.area?('от '+u.area+' м²'):'', u.beds!=null?(u.beds+' сп.'):'']
        .filter(Boolean).join(' · '), pf?('от '+baht(pf)):'']);
    });
    if(!buyRows.length) (Array.isArray(o.tiers)?o.tiers:[]).forEach(function(t){
      var b=t.bedrooms;
      buyRows.push([
        b===0?'Студия':(b+(b===1?' спальня':b<5?' спальни':' спален')),
        t.area_sqm?('от '+t.area_sqm+' м²'):'',
        t.price_from_thb?('от '+baht(t.price_from_thb)):'']);
    });

    var who=d.client_name?('Для '+esc(d.client_name)):'Персональное предложение';
    var exp=dt(d.expires_at);

    root.innerHTML=
      '<div class="top"><img src="img/brand/plp-mark-ink.png" alt=""><b>Property Library Phuket</b>'+
        '<span>'+(exp?('предложение действует до '+esc(exp)):'')+
        (d.by?('<br>подготовил: '+esc(String(d.by).replace('manager:',''))):'')+'</span></div>'+
      '<div class="card">'+
        '<div class="head">'+
          '<span class="kicker">'+esc(who)+'</span>'+
          '<h1>'+esc(o.name||'Объект')+'</h1>'+
          '<p class="sub">'+esc([o.district,o.type].filter(Boolean).join(' · '))+
            (o.developer?(' · '+esc(o.developer)):'')+'</p>'+
        '</div>'+
        '<div class="body">'+
          (on('gallery')&&o.photo?('<div class="shots">'+
            [o.photo].concat((o.photos||[]).filter(function(u){return u!==o.photo;})).slice(0,5)
              .map(function(u,i){ return '<img src="'+esc(u)+'" alt="" loading="'+(i?'lazy':'eager')+'">'; }).join('')+
            '</div>'):'')+
          (pickedUnit?('<div class="picked"><span>предлагаем</span><b>'+esc(pickedUnit)+'</b></div>'):'')+
          (on('specs')&&cells.length?('<div class="row">'+cells.map(function(c){
            return '<div class="cell"><b>'+esc(c[0])+'</b><span>'+esc(c[1])+'</span></div>';}).join('')+'</div>'):'')+
          (on('specs')&&buyRows.length?('<h2>Что можно купить</h2><div class="buy">'+
            buyRows.map(function(r){
              return '<div class="buyrow"><b>'+esc(r[0])+'</b><span>'+esc(r[1])+'</span>'+
                     (r[2]?('<u>'+esc(r[2])+'</u>'):'')+'</div>';
            }).join('')+'</div>'+
            '<p class="hint">Наличие и цены подтверждаем на дату брони — у застройщика они меняются.</p>'):'')+
          (on('about')&&o.usp?('<h2>Об объекте</h2><p class="text">'+esc(o.usp)+'</p>'):'')+
          (on('payment')&&o.payment_plan?('<h2>Условия оплаты</h2><div class="plan">'+esc(o.payment_plan)+'</div>'):'')+
          (on('map')&&o.lat&&o.lng?('<h2>На карте</h2><p class="text"><a href="https://www.google.com/maps?q='+
            o.lat+','+o.lng+'" target="_blank" rel="noopener">Открыть расположение</a></p>'):'')+
          (d.note?('<h2>От менеджера</h2><p class="text">'+esc(d.note)+'</p>'):'')+
          '<div class="note">Цены и наличие подтверждаем на дату сделки: у застройщика они меняются. '+
            'Расчёт доходности — прогноз, не гарантия.</div>'+
          '<div class="cta">'+
            '<a class="btn" href="https://wa.me/66955492587?text='+
              encodeURIComponent('Здравствуйте! По предложению: '+(o.name||'')+
                (price?(', от '+price):'')+'. Ссылка: '+location.href)+
              '" target="_blank" rel="noopener">Обсудить в WhatsApp</a>'+
            '<a class="btn ghost" href="tel:+66955492587">+66 95-549-2587</a>'+
          '</div>'+
          '<div class="foot"><span>Property Library Phuket</span>'+
            '<a href="index.html">property-library.com</a>'+
            '<span>Ссылка личная — не пересылайте её третьим лицам.</span></div>'+
        '</div>'+
      '</div>';
    document.title=(o.name?o.name+' · ':'')+'Персональное предложение';
  }
})();
</script>
</body>
</html>
