# Проверка перед выкаткой. Сайт публикуется прямым push в main, промежуточной
# сборки нет — значит сломанный скрипт уезжает к клиентам сразу. Раньше это
# ловилось только тем, что вручную запускали node --check; забыл один раз —
# и на сайте мёртвый каталог. Теперь ловит GitHub.
name: Проверка сайта

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Синтаксис встроенных скриптов
        run: |
          set -e
          python3 - <<'PY'
          import re, io, os, sys
          pages = ['index.html','buy.html','rent.html','management.html','add-property.html','owner.html','admin.html']
          pages += ['districts/'+f for f in sorted(os.listdir('districts'))] if os.path.isdir('districts') else []
          pages += ['object/'+f for f in sorted(os.listdir('object'))] if os.path.isdir('object') else []
          os.makedirs('.check', exist_ok=True)
          n = 0
          for p in pages:
              if not os.path.exists(p): continue
              s = io.open(p, encoding='utf-8').read()
              js = ''.join(m.group(1) for m in re.finditer(
                  r'<script(?![^>]*(?:src=|ld\+json))[^>]*>(.*?)</script>', s, re.S))
              if not js.strip(): continue
              out = '.check/' + p.replace('/', '__') + '.js'
              io.open(out, 'w', encoding='utf-8').write(js)
              n += 1
          print('страниц со скриптами:', n)
          PY
          for f in .check/*.js; do node --check "$f" || { echo "❌ сломан: $f"; exit 1; }; done
          echo "✅ скрипты всех страниц целы"

      # 21.09: код витрины переехал из страниц в assets/ (build/mkassets.mjs).
      # Без этой проверки главная защита перестала бы работать: сломанный
      # assets/app.js уезжает к клиентам, а страницы при этом «целы».
      - name: Общий код витрины
        run: |
          set -e
          test -f assets/app.js || { echo "❌ нет assets/app.js — витрина без кода"; exit 1; }
          test -f assets/catalog.js || { echo "❌ нет assets/catalog.js — витрина без каталога"; exit 1; }
          test -f assets/app.css || { echo "❌ нет assets/app.css — витрина без стилей"; exit 1; }
          for f in assets/*.js; do node --check "$f" || { echo "❌ сломан: $f"; exit 1; }; done
          grep -q 'PL.PROPERTIES=\[' assets/catalog.js || { echo "❌ в каталоге нет объектов продажи"; exit 1; }
          grep -q 'PL.RENTALS=\[' assets/catalog.js || { echo "❌ в каталоге нет аренды"; exit 1; }
          grep -q 'assets/app.js?v=' index.html || { echo "❌ главная не подключает общий код"; exit 1; }
          echo "✅ общий код витрины на месте и цел"

      # 21.09: три утечки за сутки — файл с номерами клиентов в репозитории,
      # номера в пояснениях к инструментам и сами инструменты, отдававшиеся
      # с сайта. Пусть о четвёртой скажет проверка, а не клиент.
      - name: Личные данные в публикуемом
        run: |
          set -e
          fail=0
          test -f _config.yml || { echo "❌ нет _config.yml — tools и build уедут на сайт"; fail=1; }
          grep -q "^  - tools" _config.yml || { echo "❌ tools не исключён из публикации"; fail=1; }
          grep -q "^  - build" _config.yml || { echo "❌ build не исключён из публикации"; fail=1; }
          if git ls-files 'tools/*.json' | grep -v price_rules | grep -q .; then
            echo "❌ рабочая выгрузка tools/*.json в репозитории"; fail=1
          fi
          # номера в том, что реально публикуется: страницы, стили, код витрины
          НАШИ='66955492587|66640709032|66954143874|66829935173|66960169127'
          чужие=$(grep -rhoE '\b[0-9]{10,13}\b' --include='*.html' --include='*.js' --include='*.css' \
                   . 2>/dev/null | sort -u | grep -vE "^($НАШИ)$" | grep -vE '^(66900000|66999000|900999)' | head -5)
          if [ -n "$чужие" ]; then echo "⚠ похожие на телефоны числа в публикуемом: $чужие"; fi
          [ "$fail" = "0" ] && echo "✅ личных данных в публикуемом нет"
          exit $fail

      - name: Сборочные скрипты
        run: for f in build/*.mjs; do node --check "$f" || exit 1; done

      - name: Структурная целостность
        run: |
          set -e
          fail=0
          grep -Eq 'href="/?object/' index.html || { echo "❌ на главной нет ссылок на объекты"; fail=1; }
          grep -q 'og:image:width' index.html || { echo "❌ нет размеров og:image — мессенджеры не покажут превью"; fail=1; }
          grep -q 'property-library.com/sitemap.xml' robots.txt || { echo "❌ в robots.txt чужая карта сайта"; fail=1; }
          grep -q '<loc>' sitemap.xml || { echo "❌ карта сайта пуста"; fail=1; }
          test -f 404.html || { echo "❌ нет страницы 404"; fail=1; }
          if grep -rlE 'service_role|SUPABASE_SERVICE_KEY[[:space:]]*=[[:space:]]*ey' --include='*.html' --include='*.js' . | grep -q .; then
            echo "❌ в HTML попал сервисный ключ"; fail=1
          fi
          [ "$fail" = "0" ] && echo "✅ структура в порядке"
          exit $fail
