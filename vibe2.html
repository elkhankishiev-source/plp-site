<!DOCTYPE html>
<html lang="ru">
<head>
<script>
/* Оформление выбирается до отрисовки, чтобы тёмная тема не моргала белым.
   Три состояния: system (атрибута нет) / light / dark. */
(function(){
  try{
    var v=localStorage.getItem('pl_theme');
    if(v==='dark'||v==='light') document.documentElement.setAttribute('data-theme',v);
  }catch(e){}
})();
</script>

<!-- PLP:HEADTHEME:START -->
<meta name="color-scheme" content="light dark">
<!-- цвет системных полей браузера = фон страницы. Без этого при прокрутке и
     оттягивании из-под страницы проглядывает чужой цвет — кажется, что фон мигает. -->
<meta name="theme-color" content="#f7f6f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0D09" media="(prefers-color-scheme: dark)">
<script>
(function(){
  function paintChrome(){
    try{
      var bg=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
      if(!bg && document.body) bg=getComputedStyle(document.body).backgroundColor;
      if(!bg || bg==='rgba(0, 0, 0, 0)') return;
      var list=document.querySelectorAll('meta[name="theme-color"]');
      for(var i=0;i<list.length;i++) list[i].parentNode.removeChild(list[i]);
      var m=document.createElement('meta'); m.setAttribute('name','theme-color');
      m.setAttribute('content',bg); document.head.appendChild(m);
    }catch(e){}
  }
  /* Кнопка «поделиться»: на телефоне открывает системное меню, на компьютере
     кладёт ссылку в буфер и говорит об этом. Эльнур 07.09: «сайтом надо
     пользоваться, он не просто для красоты». */
  document.addEventListener('click', function(e){
    var b = e.target && e.target.closest && e.target.closest('[data-share]');
    if(!b) return;
    e.preventDefault();
    var path = b.getAttribute('data-share') || location.pathname;
    var url = location.origin + path;
    var title = b.getAttribute('data-share-title') || document.title;
    var done = function(){
      var was = b.innerHTML;   /* 15.09: в кнопке живёт svg-иконка, восстанавливаем разметку целиком */
      b.textContent = '✓ Ссылка скопирована';
      b.classList.add('ok');
      setTimeout(function(){ b.innerHTML = was; b.classList.remove('ok'); }, 2200);
    };
    if(navigator.share){ navigator.share({title:title, url:url}).catch(function(){}); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done).catch(function(){ prompt('Скопируйте ссылку:', url); });
    } else prompt('Скопируйте ссылку:', url);
  });
  window.paintChrome=paintChrome;
  /* Адрес без .html: страницы и так открываются коротким адресом, но если
     человек пришёл по старой ссылке, приводим строку браузера к чистому виду.
     Эльнур 07.09: «мне не нравится html в адресе, я ни у кого её не видел». */
  try{
    var pth=location.pathname;
    if(/\.html$/.test(pth)){
      var clean=pth.replace(/index\.html$/,'').replace(/\.html$/,'');
      if(clean==='') clean='/';
      history.replaceState(null,'',clean+location.search+location.hash);
    }
  }catch(e){}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',paintChrome);
  else paintChrome();
  try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',paintChrome); }catch(e){}
})();
</script>
<!-- PLP:HEADTHEME:END -->

<script>
/* Лист оффера показываем ровно как в PDF: ширина листа 794px (210 мм), на узком экране
   уменьшаем его целиком, а не перестраиваем в колонку. Эльнур 18.09: «как в PDF, рядом». */
(function () {
  var box = document.getElementById('offerBox'), f = document.getElementById('offerFrame'), H = 4531;
  function layout() {
    var k = Math.min(1, box.clientWidth / 794);
    f.style.transform = k < 1 ? 'scale(' + k + ')' : '';
    f.style.height = H + 'px';
    box.style.height = Math.ceil(H * k) + 'px';
  }
  function fit() {
    try { var d = f.contentDocument, w = d.querySelector('.w') || d.body; var h = w.getBoundingClientRect().height; if (h > 300) H = Math.ceil(h); } catch (e) {}
    layout();
  }
  f.addEventListener('load', function () { fit(); setTimeout(fit, 700); setTimeout(fit, 2000); });
  addEventListener('resize', layout);
  addEventListener('message', function (e) { if (e && e.data && e.data.plpOfferHeight > 300) { H = Math.ceil(e.data.plpOfferHeight); layout(); } });
  layout();
})();
</script>

    try {
      new URLSearchParams(location.search).forEach(function (v, k) {
        if (/^utm_|^gclid$|^yclid$|^fbclid$/.test(k)) utm[k] = String(v).slice(0, 80);
      });
    } catch (e) {}

    function depth() {
      try {
        var h = document.documentElement;
        return (h.scrollTop + innerHeight) / Math.max(h.scrollHeight, 1) * 100;
      } catch (e) { return 0; }
    }

    function send(final) {
      if (SENT || !EV.length) return;
      /* Глубину считаем ещё и здесь: события прокрутки иногда не долетают
         (быстрый уход, программная прокрутка), а метрика нужна всегда. */
      var p = depth();
      if (!hit50 && p >= 50) { hit50 = true; add('scroll50'); }
      if (!hit90 && p >= 90) { hit90 = true; add('scroll90'); }
      if (final) SENT = true;
      var body = JSON.stringify({
        session_id: sid, page: location.pathname, referrer: document.referrer || '',
        utm: Object.keys(utm).length ? utm : null, events: EV.slice(),
        device: (innerWidth < 700 ? 'mobile' : (innerWidth < 1100 ? 'tablet' : 'desktop')),
        lang: (document.documentElement.lang || navigator.language || '').slice(0, 8),
        duration_ms: Date.now() - T0,
      });
      try {
        /* text/plain обязателен: sendBeacon умеет только CORS-безопасные типы,
           с application/json он требует предварительный запрос и молча отваливается.
           На стороне n8n тело в таком случае приходит строкой и разбирается там. */
        if (final && navigator.sendBeacon) navigator.sendBeacon(URL_, new Blob([body], { type: 'text/plain' }));
        else fetch(URL_, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: body, keepalive: true });
      } catch (e) {}
    }

    add('view');

    addEventListener('scroll', function () {
      var p = depth();
      if (!hit50 && p >= 50) { hit50 = true; add('scroll50'); }
      if (!hit90 && p >= 90) { hit90 = true; add('scroll90'); }
    }, { passive: true });

    /* Что именно нажали — по этому и считается конверсия воронки */
    addEventListener('click', function (ev) {
      try {
        var el = ev.target.closest ? ev.target.closest('a,button') : null;
        if (!el) return;
        var href = (el.getAttribute('href') || '');
        if (/wa\.me|whatsapp/i.test(href)) return add('cta_whatsapp');
        if (/t\.me/i.test(href)) return add('cta_telegram');
        if (/^object\//.test(href)) return add('object_open', href.replace('object/', '').replace('.html', ''));
        if (/owner\.html/.test(href)) return add('cta_cabinet');
        var txt = (el.textContent || '').trim().slice(0, 40).toLowerCase();
        if (/заявк|консультац|связ|подобрать|получить/.test(txt)) add('cta_lead', txt);
        else if (/каталог|подборк|pdf/.test(txt)) add('cta_catalog', txt);
        else if (/расчит|рассчит|калькул|доходност/.test(txt)) add('cta_calc', txt);
      } catch (e) {}
    }, true);

    /* Отправленная заявка — главное событие, шлём сразу, не дожидаясь ухода */
    if (typeof window.openChat === 'function') {
      var _oc = window.openChat;
      window.openChat = function () { add('chat_open', arguments[0]); try { return _oc.apply(this, arguments); } finally { send(false); } };
    }
    addEventListener('submit', function () { add('form_submit'); send(false); }, true);

    addEventListener('pagehide', function () { send(true); });
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') send(true); });
  } catch (e) {}
})();
</script>
<script>
/* 15.09: книга каталога чуть наклоняется за курсором внутри зелёной полосы.
   Только для мыши; на тачах и при reduce-motion — ничего. */
(function(){
  var band=document.querySelector('.pdfband'),img=band&&band.querySelector('.pdf-mock');
  if(!band||!img)return;
  if(!window.matchMedia||!matchMedia('(hover:hover) and (pointer:fine)').matches)return;
  if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  var raf=0,rx=0,ry=0;
  function paint(){raf=0;img.style.transform='rotateX('+rx.toFixed(2)+'deg) rotateY('+ry.toFixed(2)+'deg) translateY(-6px) scale(1.03)';}
  band.addEventListener('mousemove',function(e){
    var r=band.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;
    ry=x*14;rx=-y*10;if(!raf)raf=requestAnimationFrame(paint);
  });
  band.addEventListener('mouseleave',function(){img.style.transform='';});
})();
</script>
</body>
